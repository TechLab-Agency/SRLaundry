<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bgAA" cx="35%" cy="30%" r="85%">
    <stop offset="0%" stop-color="#12ab54"/><stop offset="100%" stop-color="#0a9c48"/>
  </radialGradient>
  <linearGradient id="waveAA" x1="0%" y1="30%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00A8E4"/><stop offset="100%" stop-color="#3FCBF5"/>
  </linearGradient>
  <clipPath id="circleClipAA"><circle cx="200" cy="200" r="188"/></clipPath>
</defs>

<circle cx="200" cy="200" r="192" fill="url(#bgAA)" stroke="#075c30" stroke-width="4"/>

<g clip-path="url(#circleClipAA)">
