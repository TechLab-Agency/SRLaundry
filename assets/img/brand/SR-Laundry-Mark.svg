  <path d="M 200.0 380.0 A 180 180 0 1 1 363.1 276.1" fill="none" stroke="#054C71" stroke-width="13" stroke-linecap="round"/>
  <path d="M 172.6 355.6 A 158 158 0 1 1 321.0 301.6" fill="none" stroke="#054C71" stroke-width="16" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="200" y="168" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="58" fill="#0B2B22">SR</text>
  <text x="200" y="215" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="500" font-size="38" fill="#0B2B22">Laundry</text>
  <text x="200" y="250" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="2" fill="#0B2B22">DRY CLEAN SERVICE</text>

  <!-- water wave -->
  <path d="M 30 300 C 80 270 110 330 150 305 C 190 280 220 240 260 250 C 300 260 330 240 380 265 L 380 420 L 30 420 Z"
        fill="url(#waveAA)"/>

  <!-- bubbles -->
  <circle cx="70" cy="292" r="7" fill="#ffffff" opacity="0.95"/>
  <circle cx="105" cy="270" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="140" cy="284" r="5.5" fill="#ffffff" opacity="0.9"/>
  <circle cx="165" cy="260" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="205" cy="270" r="4.5" fill="#ffffff" opacity="0.85"/>
  <circle cx="245" cy="255" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="290" cy="248" r="6" fill="#ffffff" opacity="0.95"/>
  <circle cx="330" cy="258" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="115" cy="305" r="3" fill="#ffffff" opacity="0.75"/>
  <circle cx="230" cy="288" r="3" fill="#ffffff" opacity="0.7"/>
</g>
</svg>
